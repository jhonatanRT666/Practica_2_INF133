{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<h1 class="h3 mb-3">{{ titulo }}</h1>

<form method="post" class="bg-white border rounded p-4" novalidate>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre"
               maxlength="100" required value="{{ carrera.nombre or '' }}">
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción (opcional)</label>
        <textarea class="form-control" id="descripcion" name="descripcion"
                  rows="3" maxlength="255">{{ carrera.descripcion or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('listar_carreras') }}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
