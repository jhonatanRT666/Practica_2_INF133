<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Gestión académica{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('listar_carreras') }}">Gestión académica</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.path.startswith('/carreras') }}"
                   href="{{ url_for('listar_carreras') }}">Carreras</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.path.startswith('/estudiantes') }}"
                   href="{{ url_for('listar_estudiantes') }}">Estudiantes</a>
            </li>
        </ul>
    </div>
</nav>

<main class="container pb-5">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                {{ mensaje }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
